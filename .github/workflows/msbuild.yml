name: MSBuild

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  SOLUTION_FILE_PATH: ./gdevice.2008.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Win32

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }} ${{ env.SOLUTION_FILE_PATH }}

    - name: Create walker artifact ZIP
      shell: powershell
      run: |
        $files = @('binaries\release\walker.exe')
        $optionalFiles = @('binaries\release\walker.pdb')
        $files += $optionalFiles | Where-Object { Test-Path $_ }

        if (Test-Path 'tests\walker\assets') {
          $files += Get-ChildItem -Path 'tests\walker\assets' -Recurse -File |
            ForEach-Object { $_.FullName }
        }

        if (-not (Test-Path 'binaries\release\walker.exe')) {
          throw 'Expected build output was not found: binaries\\release\\walker.exe'
        }

        New-Item -ItemType Directory -Path artifacts -Force | Out-Null
        Compress-Archive -Path $files -DestinationPath artifacts\walker-artifacts.zip -Force

    - name: Upload walker ZIP
      uses: actions/upload-artifact@v4
      with:
        name: walker-artifacts-zip
        path: artifacts/walker-artifacts.zip
